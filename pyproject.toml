[project]
name = "hfdlobserver"
version = "0.1.0"
description = "A multi-headed manager for dumphfdl and SDRs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backports-asyncio-runner ; python_full_version < '3.11'",
    "chunkmuncher>=0.0.2 ; python_full_version >= '3.13'",
    "click>=8.5.0",
    "ka9q-python>=3.26.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "pyzmq>=27.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "whiptail-dialogs>=0.4.1",
]

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    ".idea",
    ".vscode",
    ".pytest_cache",
    ".mypy_cache",
    "*.md",
    "*.json",
    "*.yaml"
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "B9", # bugbear opinions
    "E",  # pycodestyle errors
    "ISC", # imlicit string concatenation
    "W",  # pycodestyle warnings
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
